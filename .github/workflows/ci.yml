# Runs on every push to main and on pull requests. Only checks that give the same
# result every run: a check that sometimes fails when nothing is broken teaches
# people to ignore a red X. The model-graded evals are in evals.yml, run by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs exactly what package-lock.json lists.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Leave calculator unit tests
        run: npm run test:tools

      - name: Signed history unit tests
        run: npm run test:history

      # Needs only Voyage (embeddings and reranker), no Groq tokens.
      - name: Retrieval evals (every question must find its sections)
        run: npm run ci:retrieval
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}

      # Catches what only the build sees, like index.json missing from the repo.
      - name: Build
        run: npm run build
