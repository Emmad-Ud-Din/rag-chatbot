name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
            
            - run: npm ci

            - name: Leave calculator unit tests
              run: npm run test:tools
            - name: Signed history unit tests
              run: npm run test:history 
            - name: Retrieval tests
              run: npm run ci:retrieval
              env:
                VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
            - name: build
              run: npm run build
